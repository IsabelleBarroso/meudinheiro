<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>MeuDinheiro</title>
<meta name="theme-color" content="#6d4fc6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MeuDinheiro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Sora:wght@400;600;700;800&family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;700&display=swap">
<style>
/* Layout: coluna de celular centralizada, navegação inferior fixa, folhas (bottom sheets) para lançar e detalhar */
:root{
  --bg:#f1f5f3; --surface:#ffffff; --surface-2:#e8f0ec; --fg:#13201b; --muted:#5a6a63; --faint:#8a9a93; --line:#d8e3de;
  --mint:#1a8f6c; --mint-strong:#137257; --mint-soft:#d3efe4; --lilac:#7b5fcc; --lilac-soft:#ebe4fb;
  --danger:#c93636; --danger-soft:#fbe3e1; --warn:#a36b00; --warn-soft:#fbefd4; --good:#0c8a4c;
  --s-div:#d0508a; --s-nec:#3f7fd0; --s-des:#e0892a; --s-res:#8b6fd6; --s-liv:#1f9e78;
  --shadow:0 1px 2px rgba(19,32,27,.06),0 6px 20px rgba(19,32,27,.06);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:var(--f-display); --on-accent:#ffffff; --r-card:18px; --r-btn:14px;
  --pl1a:#6a4fc2; --pl1b:#8f74e0; --pl2a:#127056; --pl2b:#23a37d;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1513; --surface:#162019; --surface-2:#1d2a25; --fg:#e7f0ec; --muted:#9aaba4; --faint:#6f807a; --line:#2a3833;
  --mint:#3cc79b; --mint-strong:#5bd8ae; --mint-soft:#163a2f; --lilac:#b39cf5; --lilac-soft:#2a2442;
  --danger:#ef6f6f; --danger-soft:#3a1d1d; --warn:#e3a93a; --warn-soft:#3a2d12; --good:#3fcf85;
  --s-div:#d55181; --s-nec:#4f8ae0; --s-des:#d95926; --s-res:#9179e0; --s-liv:#23a37d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --on-accent:#06241a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1513; --surface:#162019; --surface-2:#1d2a25; --fg:#e7f0ec; --muted:#9aaba4; --faint:#6f807a; --line:#2a3833;
  --mint:#3cc79b; --mint-strong:#5bd8ae; --mint-soft:#163a2f; --lilac:#b39cf5; --lilac-soft:#2a2442;
  --danger:#ef6f6f; --danger-soft:#3a1d1d; --warn:#e3a93a; --warn-soft:#3a2d12; --good:#3fcf85;
  --s-div:#d55181; --s-nec:#4f8ae0; --s-des:#d95926; --s-res:#9179e0; --s-liv:#23a37d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --on-accent:#06241a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.app{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:8px 110px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:.82rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.card{background:var(--surface);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow)}
.flat{background:var(--surface-2);border-radius:14px;padding:12px 14px}
.sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 10px;margin-top:6px}
.sec-h>.small{flex-basis:100%}
.link{background:none;border:0;color:var(--mint);font-weight:600;cursor:pointer;padding:4px 0;font-size:.88rem}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.p-pago{background:var(--mint-soft);color:var(--mint-strong)}
.p-prev{background:var(--surface-2);color:var(--muted)}
.p-aberta{background:var(--lilac-soft);color:var(--lilac)}
.p-fechada{background:var(--warn-soft);color:var(--warn)}
.p-neg{background:var(--danger-soft);color:var(--danger)}

/* Topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.brand b{color:var(--mint)}
.today{font-size:.78rem;color:var(--muted);text-align:right}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:12px}
.monthbar .m{font-family:var(--f-display);font-weight:700;font-size:1.05rem;text-transform:capitalize;text-align:center;flex:1}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:1.1rem}
.iconbtn:disabled{opacity:.35;cursor:default}

/* Hero */
.hero{background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.bignum{font-family:var(--f-num);font-weight:800;font-size:2.6rem;line-height:1;letter-spacing:-.03em}
.bignum.neg{color:var(--danger)}
.flow{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface-2)}
.flow i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.hatch{background-image:repeating-linear-gradient(45deg,var(--c) 0 3px,transparent 3px 6px);border:1px solid var(--c)}

/* Linhas de conta */
.ledger{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .sign{font-weight:700;color:var(--muted);text-align:center}
.lrow .lbl{min-width:0}
.lrow .lbl .t{font-weight:600}
.lrow .sub{margin-top:0;padding:6px 10px;background:var(--surface-2);border-radius:10px}
.lrow .v{font-weight:700;text-align:right}
.lrow.total{border-top:2px solid var(--fg);border-bottom:0;margin-top:2px}
.lrow.total .t,.lrow.total .v{font-family:var(--f-display);font-size:1.05rem}
.sub{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.sub div{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted)}

/* Itens */
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item:focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:8px}
.ico{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:1.15rem}
.item .main{min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{font-size:.8rem;color:var(--muted)}
.item .r{text-align:right}
.item .r .v{font-weight:700}
.impact{font-size:.76rem;color:var(--lilac);font-weight:600}

/* Cartões */
.cardtabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.ctab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.ctab.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.plastic{border-radius:20px;padding:18px;color:#fff;display:flex;flex-direction:column;gap:14px;min-height:150px}
.plastic.lilac{background:linear-gradient(135deg,var(--pl1a),var(--pl1b))}
.plastic.mint{background:linear-gradient(135deg,var(--pl2a),var(--pl2b))}
.plastic .nm{font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.plastic .meta{display:flex;gap:18px;font-size:.8rem;opacity:.92;flex-wrap:wrap}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.28);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:4px}
.meter{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:5px}

.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;position:relative}
.timeline .st{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:.74rem;color:var(--muted);position:relative}
.timeline .st b{display:block;color:var(--fg);font-size:.82rem}
.timeline .dot{width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--mint);position:relative;z-index:1}
.timeline .st.now .dot{background:var(--lilac);border-color:var(--lilac)}
.timeline::before{content:"";position:absolute;top:6px;left:12%;right:12%;height:2px;background:var(--line)}

.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.hbar .lab{font-size:.85rem;display:flex;gap:8px;align-items:center;min-width:0}
.hbar .lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .val{font-size:.85rem;font-weight:700;text-align:right}
.hbar .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-bottom:6px}
.hbar .track i{display:block;height:100%;border-radius:4px;background:var(--mint)}

.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .vl{fill:var(--fg);font-weight:700}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--faint);stroke-width:1}
.chart [data-tip]{cursor:pointer}

.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:9px;cursor:pointer;font-weight:600;font-size:.82rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
.tbl tr.fut td{color:var(--faint)}
.tbl tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--fg)}
.scrollx{overflow-x:auto}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.kpi .k{font-size:.75rem;color:var(--muted)}
.kpi .n{font-family:var(--f-display);font-weight:700;font-size:1.2rem;margin-top:2px}

.moregrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:0;border-radius:18px;padding:16px;text-align:left;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:108px}
.tile .ti{font-size:1.4rem}
.tile b{font-family:var(--f-display);font-size:1rem}
.tile span{font-size:.78rem;color:var(--muted)}

.note{border-left:3px solid var(--lilac);background:var(--lilac-soft);padding:10px 12px;border-radius:0 12px 12px 0;font-size:.85rem}
.note.mint{border-color:var(--mint);background:var(--mint-soft)}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}

/* Botões */
.btn{border:0;border-radius:var(--r-btn);padding:13px 16px;font-weight:700;cursor:pointer;background:var(--mint);color:var(--on-accent);width:100%}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn:focus-visible,.ctab:focus-visible,.iconbtn:focus-visible,.tile:focus-visible,.nav button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.fab{position:fixed;right:max(16px,calc(50% - 214px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:0;background:var(--fg);color:var(--bg);font-size:1.8rem;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:6}

/* Navegação */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;padding:9px 2px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;color:var(--muted);font-weight:600}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--mint)}

/* Folha */
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:460px;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.inp:focus{outline:2px solid var(--mint);outline-offset:0;border-color:transparent}
.bigin{font-family:var(--f-display);font-size:1.8rem;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 11px;cursor:pointer;font-size:.84rem}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.preview{border-radius:14px;padding:12px 14px;background:var(--lilac-soft);font-size:.87rem;display:flex;flex-direction:column;gap:4px}
.preview b{color:var(--lilac)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:14px;z-index:30;max-width:min(420px,calc(100% - 32px));font-size:.86rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tip{position:fixed;z-index:40;background:var(--fg);color:var(--bg);font-size:.78rem;padding:6px 9px;border-radius:8px;pointer-events:none;max-width:220px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;cursor:pointer}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--mint)}
.demo{font-size:.72rem;background:var(--warn-soft);color:var(--warn);border-radius:99px;padding:3px 9px;font-weight:700}

/* ===== Modelos visuais ===== */
.models{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.mbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:6px 12px 6px 6px;cursor:pointer;font-weight:600;font-size:.82rem;white-space:nowrap;font-family:var(--f-body)}
.mbtn .sw2{width:22px;height:22px;border-radius:50%;flex:none}
.mbtn.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}

/* Lilás: arredondado, macio, hero colorido */
:root[data-model="lilas"]{
  --bg:#f5f2fb; --surface:#ffffff; --surface-2:#efe9fa; --fg:#221a36; --muted:#6b6284; --faint:#9a92b0; --line:#e3dcf2;
  --mint:#7b5fcc; --mint-strong:#5f45b0; --mint-soft:#e9e1fb; --lilac:#c0577e; --lilac-soft:#fbe6ee;
  --f-display:"Nunito",system-ui,sans-serif; --f-body:"Nunito",system-ui,sans-serif; --f-num:"Nunito",system-ui,sans-serif;
  --on-accent:#ffffff; --r-card:26px; --r-btn:18px; --shadow:0 2px 4px rgba(60,30,120,.05),0 10px 30px rgba(90,60,170,.10);
  --pl1a:#7b5fcc; --pl1b:#b69cf5; --pl2a:#c0577e; --pl2b:#e59bb7;
  --hero-a:#6d4fc6; --hero-b:#a88bf0;
}
@media (prefers-color-scheme: dark){:root[data-model="lilas"]:not([data-theme="light"]){
  --bg:#151121; --surface:#1f1930; --surface-2:#2a2240; --fg:#efeaff; --muted:#aea4c8; --faint:#7d7497; --line:#342b4d;
  --mint:#b39cf5; --mint-strong:#cbbbfb; --mint-soft:#2e2550; --lilac:#f08db0; --lilac-soft:#3b2130; --on-accent:#1b1230;
  --hero-a:#4a3496; --hero-b:#7b5fcc; color-scheme:dark}}
:root[data-model="lilas"][data-theme="dark"]{
  --bg:#151121; --surface:#1f1930; --surface-2:#2a2240; --fg:#efeaff; --muted:#aea4c8; --faint:#7d7497; --line:#342b4d;
  --mint:#b39cf5; --mint-strong:#cbbbfb; --mint-soft:#2e2550; --lilac:#f08db0; --lilac-soft:#3b2130; --on-accent:#1b1230;
  --hero-a:#4a3496; --hero-b:#7b5fcc; color-scheme:dark}
:root[data-model="lilas"] .hero{background:linear-gradient(145deg,var(--hero-a),var(--hero-b));color:#fff;border-radius:30px;--s-res:#ffcfe2}
:root[data-model="lilas"] .hero .eyebrow,:root[data-model="lilas"] .hero .muted,:root[data-model="lilas"] .hero .legend{color:rgba(255,255,255,.85)}
:root[data-model="lilas"] .hero .bignum{font-weight:900;font-size:2.9rem}
:root[data-model="lilas"] .hero .flow{background:rgba(255,255,255,.2)}
:root[data-model="lilas"] .hero .bignum.neg{color:#ffd1dc}
:root[data-model="lilas"] .brand b{color:var(--mint)}
:root[data-model="lilas"] .nav button.on{color:var(--mint)}
:root[data-model="lilas"] .nav button.on svg{background:var(--mint-soft);border-radius:10px;padding:2px;width:30px;margin-block:-2px}
:root[data-model="lilas"] .fab{background:var(--mint);color:var(--on-accent);border-radius:50%}
:root[data-model="lilas"] .ico{border-radius:50%}
:root[data-model="lilas"] h1,:root[data-model="lilas"] h2{font-weight:800}

/* Grafite: escuro sempre, detalhes em âmbar, bordas em vez de sombras */
:root[data-model="grafite"]{
  --bg:#121417; --surface:#1a1d21; --surface-2:#23272c; --fg:#eceae4; --muted:#a2a39e; --faint:#71736f; --line:#2e3238;
  --mint:#e8b04b; --mint-strong:#f2c46e; --mint-soft:#3a2f1a; --lilac:#9fb4ff; --lilac-soft:#1f2640;
  --danger:#ef6f6f; --danger-soft:#3a1d1d; --warn:#e3a93a; --warn-soft:#3a2d12; --good:#3fcf85;
  --s-div:#d55181; --s-nec:#4f8ae0; --s-des:#d95926; --s-res:#9179e0; --s-liv:#23a37d;
  --f-display:"Sora",system-ui,sans-serif; --f-body:"Sora",system-ui,sans-serif; --f-num:"Sora",system-ui,sans-serif;

.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}

  if(x.status!=='pago'&&((x.kind==='cartao'&&P.has(`fat:${x.card}:${ymKey(x.ym)}`))||(x.lanc&&P.has(`lanc:${x.lanc}:${ymKey(x.ym)}`))))x.status='pago';return x});MEMO={}}

const OUT_KINDS=['cartao','conta','divida','avista'];
/* Teto do cartão: tudo que vence no cartão no mês v — compras, parcelas e assinaturas */
function tetoMes(v){const a=ITEMS.filter(x=>x.kind==='cartao'&&x.ym===v);const sum=f=>a.filter(f).reduce((s,x)=>s+x.valor,0);
  const ass=sum(x=>x.rec), parc=sum(x=>!x.rec&&x.n>1&&x.i>1), uso=sum(()=>true);return {uso,ass,parc,novas:uso-ass-parc,teto:S.config.teto||0}}
function cicloAberto(){const ab=S.cards.map(c=>({c,f:fatura(c,TODAY)}));const alvo=Math.min(...ab.map(a=>a.f.venc));return {alvo,cards:ab.filter(a=>a.f.venc===alvo)}}
function resumo(v){
  if(MEMO[v]) return MEMO[v];
  const it=ITEMS.filter(x=>x.ym===v);
  const sum=(arr)=>arr.reduce((a,x)=>a+x.valor,0);
  const rec=it.filter(x=>x.kind==='receita');
  const r={v,items:it,
    salario:sum(rec.filter(x=>x.tipo==='salario')), extras:sum(rec.filter(x=>x.tipo!=='salario')),
    entradas:sum(rec), entradasRecebidas:sum(rec.filter(x=>x.status==='pago')),
    cartoes:S.cards.map(c=>{const a=it.filter(x=>x.kind==='cartao'&&x.card===c.id);return {card:c,valor:sum(a),pago:a.length&&a.every(x=>x.status==='pago'),venc:dateIn(v,c.vence),itens:a}}),
    contas:sum(it.filter(x=>x.kind==='conta')), dividas:sum(it.filter(x=>x.kind==='divida')),
    avista:sum(it.filter(x=>x.kind==='avista')), reserva:sum(it.filter(x=>x.kind==='reserva'))
  };
  r.cartao=r.cartoes.reduce((a,c)=>a+c.valor,0);
  r.saidas=r.cartao+r.contas+r.dividas+r.avista;
  const outs=it.filter(x=>OUT_KINDS.includes(x.kind)||x.kind==='reserva');
  r.jaSaiu=sum(outs.filter(x=>x.status==='pago')); r.vaiSair=sum(outs.filter(x=>x.status!=='pago'));
  /* Sobra só passa adiante de meses que já aconteceram (ou do mês atual). Sobra projetada de um mês futuro ainda vai ser usada no dia a dia dele. */
  r.sobraAnt = v===START()? S.config.saldoInicial : (S.config.levarSobra&&v>START()&&v-1<=TODAY_YM? resumo(v-1).livre : 0);
  r.sobraPendente = S.config.levarSobra && v-1>TODAY_YM;
  r.livre=r.sobraAnt+r.entradas-r.saidas-r.reserva;
  MEMO[v]=r; return r;
}
/*END*/

function impactoLanc(l){
  const its=ITEMS.filter(x=>x.lanc===l.id);

  const f=its[0];
  if(l.forma==='credito'){

  }
  if(l.forma==='boleto') return {its,txt:`${l.parcelas}x · 1ª em ${ddmm(f.date)}`};
  return {its,txt:`Saiu em ${mesNome(f.ym)}`};
}
function itemLanc(l,ctxV){

}

/* ---------- GRÁFICOS ---------- */
function chartBars(data,opt={}){
  const W=340,H=150,top=18,bot=22,left=4,right=4;
  const max=Math.max(1,...data.map(d=>d.val)), min=Math.min(0,...data.map(d=>d.val));
  const span=max-min, y=v=>top+(max-v)/span*(H-top-bot);
  const bw=Math.min(38,(W-left-right)/data.length*0.56), step=(W-left-right)/data.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de barras">`;
  s+=`<line class="base" x1="${left}" x2="${W-right}" y1="${y(0)}" y2="${y(0)}"/>`;
  data.forEach((d,i)=>{const cx=left+step*i+step/2, y0=y(0), y1=y(d.val), h=Math.max(2,Math.abs(y1-y0));
    const neg=d.val<0, col=d.col||(neg?'var(--danger)':'var(--s-liv)');
    const yy=neg?y0:y0-h;
    s+=`<g ${opt.act?`data-act="${opt.act}" data-v="${d.v}"`:''} data-tip="${esc(d.tip)}"><rect x="${cx-step/2}" y="${top-14}" width="${step}" height="${H-top+14}" fill="transparent"/>
      <path d="${neg?`M${cx-bw/2},${yy} h${bw} v${h-4} q0,4 -4,4 h${-(bw-8)} q-4,0 -4,-4 z`:`M${cx-bw/2},${yy+4} q0,-4 4,-4 h${bw-8} q4,0 4,4 v${h-4} h${-bw} z`}" fill="${col}"/>
      ${data.length<=8||i===0||i===data.length-1?`<text class="vl" x="${cx}" y="${neg?yy+h+11:yy-4}" text-anchor="middle">${fmt0(d.val).replace('R$ ','')}</text>`:''}
      <text x="${cx}" y="${H-6}" text-anchor="middle">${d.lab}</text></g>`;});
  return `<div class="chart">${s}</svg></div>`;
}
function chartPair(data,names){ // duas séries lado a lado
  const W=340,H=170,top=16,bot=22,left=4,right=4;
  const max=Math.max(1,...data.flatMap(d=>[d.a,d.b]));
  const y=v=>top+(max-v)/max*(H-top-bot), step=(W-left-right)/data.length, bw=Math.min(14,step*0.3);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${names.join(' e ')} por mês">`;
  [0.5,1].forEach(f=>{s+=`<line class="grid" x1="${left}" x2="${W-right}" y1="${y(max*f)}" y2="${y(max*f)}"/>`});
  s+=`<line class="base" x1="${left}" x2="${W-right}" y1="${y(0)}" y2="${y(0)}"/>`;
  const bar=(x,v,col)=>{const h=Math.max(2,y(0)-y(v));return `<path d="M${x},${y(0)-h+4} q0,-4 4,-4 h${bw-8} q4,0 4,4 v${h-4} h${-bw} z" fill="${col}"/>`};
  data.forEach((d,i)=>{const cx=left+step*i+step/2;
    s+=`<g data-tip="${esc(d.tip)}"><rect x="${cx-step/2}" y="0" width="${step}" height="${H}" fill="transparent"/>${bar(cx-bw-1,d.a,'var(--s-liv)')}${bar(cx+1,d.b,'var(--s-des)')}<text x="${cx}" y="${H-6}" text-anchor="middle">${d.lab}</text></g>`;});
  return `<div class="chart">${s}</svg></div><div class="legend" style="margin-top:6px"><span><i class="sw" style="background:var(--s-liv)"></i>${names[0]}</span><span><i class="sw" style="background:var(--s-des)"></i>${names[1]}</span></div>`;
}
function chartLine(data,col='var(--s-res)'){
  const W=340,H=140,top=18,bot=22,left=6,right=6;
  const max=Math.max(1,...data.map(d=>d.val)), min=Math.min(0,...data.map(d=>d.val));
  const x=i=>left+(W-left-right)*(data.length<2?0.5:i/(data.length-1)), y=v=>top+(max-v)/(max-min)*(H-top-bot);
  const pts=data.map((d,i)=>`${x(i)},${y(d.val)}`).join(' ');
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de linha">`;
  s+=`<line class="grid" x1="${left}" x2="${W-right}" y1="${y(max)}" y2="${y(max)}"/><line class="base" x1="${left}" x2="${W-right}" y1="${y(0)}" y2="${y(0)}"/>`;
  s+=`<polygon points="${x(0)},${y(0)} ${pts} ${x(data.length-1)},${y(0)}" fill="${col}" opacity=".12"/>`;
  s+=`<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
  data.forEach((d,i)=>{const last=i===data.length-1||i===0;
    s+=`<g data-tip="${esc(d.tip)}"><rect x="${x(i)-12}" y="0" width="24" height="${H}" fill="transparent"/><circle cx="${x(i)}" cy="${y(d.val)}" r="${last?4.5:3}" fill="${col}" stroke="var(--surface)" stroke-width="2"/>
    ${last?`<text class="vl" x="${x(i)}" y="${y(d.val)-9}" text-anchor="${i===0?'start':'end'}">${fmt0(d.val)}</text>`:''}<text x="${x(i)}" y="${H-6}" text-anchor="middle">${d.lab}</text></g>`;});
  return `<div class="chart">${s}</svg></div>`;
}
function hbars(rows,maxv){
  maxv=maxv||Math.max(1,...rows.map(r=>r.val));
  return `<div class="hbar">${rows.map(r=>`<div class="lab">${r.ic?`<b>${r.ic}</b>`:''}<span>${esc(r.lab)}</span></div><div class="val num">${fmt(r.val)}</div><div class="track"><i style="width:${Math.max(1,r.val/maxv*100)}%;${r.col?`background:${r.col}`:''}"></i></div>`).join('')}</div>`;
}

const DIMS={cat:'Categoria',pag:'Pagamento',cartao:'Cartão',divida:'Dívida'};
const PAG_IC={pix:'⚡',debito:'🏧',dinheiro:'💵',credito:'💳',boleto:'🧾'};
const OUT=x=>OUT_KINDS.includes(x.kind);
function dimKey(x,d){
  if(d==='cat') return x.cat;
  if(d==='pag') return x.kind==='cartao'?'credito':x.kind==='divida'?'boleto':x.forma;
  if(d==='cartao') return x.kind==='cartao'?x.card:null;
  if(d==='divida') return x.lanc&&x.n>1?x.lanc:null;
}
function dimInfo(d,k){
  if(d==='cat'){const c=catOf(k);return {nome:c.nome,ic:c.ic}}
  if(d==='pag') return {nome:FORMAS[k]||k,ic:PAG_IC[k]||'💰'};
  if(d==='cartao'){const c=cardOf(k);return {nome:c?c.nome:k,ic:'💳'}}
  const l=S.lancs.find(z=>z.id===k);return {nome:l?l.desc:k,ic:l?catOf(l.cat).ic:'📄'};
}
function faixa(modo,v){return modo==='mes'?[v,v]:[Math.max(START(),ymY(v)*12),v]}
function itensFaixa(a,b){return ITEMS.filter(x=>OUT(x)&&x.ym>=a&&x.ym<=b)}
function agrupa(its,d){const m={};its.forEach(x=>{const k=dimKey(x,d);if(k==null)return;m[k]=(m[k]||0)+x.valor});return Object.entries(m).map(([k,v])=>({k,v,...dimInfo(d,k)})).sort((a,b)=>b.v-a.v)}

}

/* ---------- CARTÕES ---------- */
function statusFatura(card,close){
  const cd=dateIn(close,card.fecha), vd=dateIn(card.vence>card.fecha?close:close+1,card.vence);
  const cur=fatura(card,TODAY).close;
  if(vd<=TODAY) return ['paga','p-pago'];
  if(close<cur) return ['fechada','p-fechada'];
  if(close===cur) return ['aberta','p-aberta'];
  return ['futura','p-prev'];
}

function chartPairStack(rows){
  const W=340,H=150,top=10,bot=20;
  const max=Math.max(1,...rows.map(r=>r.sal+r.ext)), y=v=>top+(max-v)/max*(H-top-bot), step=W/12, bw=step*0.58;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Salário e extras por mês"><line class="base" x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}"/>`;
  rows.forEach((r,i)=>{const cx=step*i+step/2, hs=y(0)-y(r.sal), he=y(0)-y(r.sal+r.ext)-hs;
    s+=`<g data-tip="${cap(MES3[ymM(r.v)])}: salário ${fmt(r.sal)}${r.ext?' + extras '+fmt(r.ext):''}" opacity="${r.fut?0.45:1}"><rect x="${cx-step/2}" y="0" width="${step}" height="${H}" fill="transparent"/>
    <rect x="${cx-bw/2}" y="${y(r.sal)}" width="${bw}" height="${Math.max(0,hs)}" fill="var(--s-liv)" ${r.ext?'':'rx="3"'}/>
    ${r.ext?`<rect x="${cx-bw/2}" y="${y(r.sal+r.ext)}" width="${bw}" height="${Math.max(0,he-2)}" rx="3" fill="var(--s-res)"/>`:''}
    <text x="${cx}" y="${H-5}" text-anchor="middle">${MES3[ymM(r.v)].slice(0,1).toUpperCase()}</text></g>`});
  return `<div class="chart">${s}</svg></div><div class="legend" style="margin-top:6px"><span><i class="sw" style="background:var(--s-liv)"></i>Salário</span><span><i class="sw" style="background:var(--s-res)"></i>13º, férias, bônus e extras</span><span class="faint">claro = previsto</span></div>`;
}

function dividasLista(){

  return Object.entries(map).map(([id,a])=>{const l=S.lancs.find(z=>z.id===id);a.sort((p,q)=>p.i-q.i);
    const total=a.reduce((s,x)=>s+x.valor,0), pagas=a.filter(x=>x.status==='pago').length, rest=a.filter(x=>x.status!=='pago');
    const restante=rest.reduce((s,x)=>s+x.valor,0), fim=a[a.length-1].ym, faltam=rest.length;
    return {l,a,total,pagas,n:l.parcelas,restante,fim,faltam,parcela:a[0].valor,juros:l.valorParcela?l.valorParcela*l.parcelas-l.valor:0,
      prazo:faltam<=6?'curto':faltam<=12?'medio':'longo'}}).filter(d=>d.restante>0).sort((a,b)=>a.fim-b.fim);
}

    <div class="scrollx"><table class="tbl num"><thead><tr><th></th><th>Referência</th><th>Você</th></tr></thead><tbody>
    <tr><td>Necessidades</td><td>50%</td><td><b>${nec.toFixed(0)}%</b></td></tr>
    <tr><td>Desejos</td><td>30%</td><td><b>${des.toFixed(0)}%</b></td></tr>
    <tr><td>Futuro (reserva + sobra)</td><td>20%</td><td><b>${fut.toFixed(0)}%</b></td></tr>
    <tr><td>Dívidas financeiras</td><td>—</td><td><b>${P(g.div)}</b></td></tr></tbody></table></div>
    <p class="small muted" style="margin:0">É uma referência, não uma regra. O parcelamento é um compromisso futuro, mas não muda a natureza do gasto: uma compra de Casa continua sendo Necessidade; uma compra de lazer continua sendo Desejo.</p>
  </section>

    ${[['Necessidade ou desejo?','Necessidade é o que você teria que pagar mesmo num mês difícil. O resto é desejo, e tudo bem ter desejos, desde que caibam.'],

}

function drawPrev(){
  const el=document.getElementById('gPrev'); if(!el) return;

    el.innerHTML=`<div>Entra na fatura do <b>${esc(c.nome)}</b> que fecha ${ddmm(dateIn(f.close,c.fecha))} e vence ${ddmm(dateIn(f.venc,c.vence))}.</div>

function salvarGasto(){
  const val=parseBRL(G.valor); if(!val){toast('Digite o valor da compra.');G.step=0;drawGasto();return}
  if(!G.forma){toast('Escolha como pagou.');G.step=1;drawGasto();return}
  if(!G.cat){toast('Escolha a categoria.');G.step=2;drawGasto();return}
  const n=parcelado()?+G.n:1, vp=parseBRL(G.vp); snap();
  let l=G.editId?S.lancs.find(x=>x.id===G.editId):null;
  const mudou=l&&(l.data!==G.data||l.forma!==G.forma||(l.card||'')!==(G.forma==='credito'?G.card:''));
  if(!l){l={id:'u'+Date.now()};S.lancs.push(l)}
  Object.assign(l,{desc:G.desc.trim()||catOf(G.cat).nome,cat:G.cat,valor:val,data:G.data||TODAY,forma:G.forma});
  delete l.card;delete l.parcelas;delete l.valorParcela;if(mudou){delete l.primeiraFatura;delete l.primeiroVenc}
  if(G.forma==='credito') l.card=G.card; if(n>1) l.parcelas=n; if(vp&&n>1) l.valorParcela=vp;
  if(G.forma==='boleto'){l.parcelas=Math.max(1,n);if(!l.primeiroVenc)l.primeiroVenc=dateIn(ym(l.data)+1,+l.data.slice(8,10))}
  const editou=!!G.editId; recompute(); closeSheet(); render();
  const f=ITEMS.find(x=>x.lanc===l.id);
  toast(`${editou?'Alterado':'Lançado'}: ${esc(l.desc)} · ${n>1?`${n}x de ${fmt(f.valor)}, a 1ª`:fmt(val)} pesa em <b>${mesNome(f.ym)}</b>.`,[{t:'Desfazer',a:'undo'}]);
}

  <div class="field"><label for="lvSaldo">Quanto falta pagar</label><input class="inp num" id="lvSaldo" inputmode="decimal" value="${x?(x.saldo/100).toLocaleString('pt-BR',{minimumFractionDigits:2}):''}" placeholder="0,00"></div>
  <div class="field"><label for="lvObs">Observação</label><input class="inp" id="lvObs" value="${esc(x?x.obs:'')}" placeholder="Ex.: pago por pix quando der"></div>
  <button class="btn" data-act="salvarLivre" data-id="${x?x.id:''}">${x?'Salvar alterações':'Adicionar'}</button>
  ${x?`<div id="livreDel"><button class="btn danger" data-act="pedirDel" data-tipo="livre" data-id="${x.id}">Excluir (já quitei)</button></div>`:''}
  <button class="btn ghost" data-act="close">Fechar</button>`);
}
const DEL_TXT={conta:'A recorrente some de todos os meses.',receita:'A receita some do mês.',cat:'A categoria some da lista.',meta:'A reserva e o saldo dela somem.',livre:'A dívida some da lista.'};
const DEL_BOX={conta:'contaDel',receita:'recDel',cat:'catDel',meta:'metaDel',livre:'livreDel'};
/* ---------- AÇÕES ---------- */
const VIEWS={inicio:viewInicio,gastos:viewGastos,cartoes:viewCartoes,salario:viewSalario,mais:viewMais,dividas:viewDividas,reservas:viewReservas,relatorios:viewRelatorios,disciplina:viewDisciplina,simulador:viewSimulador,config:viewConfig};
const ACT={
  tab:el=>{UI.tab=el.dataset.t;closeSheet();render();scrollTo(0,0)},
  mes:el=>{UI.v+=+el.dataset.d;render()},
  mesSel:el=>{UI.v=+el.dataset.v;UI.tab='inicio';render();scrollTo(0,0)},
  periodo:el=>{UI.periodo=+el.dataset.p;render()},
  ano:el=>{UI.ano=+el.dataset.a;render()},
  cardSel:el=>{UI.card=el.dataset.id;render()},
  irCartao:el=>{UI.card=el.dataset.id;UI.tab='cartoes';render();scrollTo(0,0)},
  verFatura:el=>sheetFatura(+el.dataset.k),
  verLanc:el=>sheetLanc(el.dataset.id),
  verConta:el=>sheetConta(el.dataset.id),
  novaConta:()=>sheetConta(null),
  novoGasto:()=>sheetGasto(),
  novaReceita:()=>sheetReceita(),
  movMeta:el=>sheetMov(el.dataset.id,+el.dataset.s),
  close:()=>closeSheet(),
  scrim:(el,e)=>{if(e.target===el)closeSheet()},
  gNext:()=>{if(G.step===0&&!parseBRL(G.valor)){toast('Digite o valor da compra para continuar.');return}
    if(G.step===1&&!G.forma){toast('Escolha como pagou.');return}
    G.step=G.step===1&&G.cat?3:G.step+1;drawGasto()},
  gBack:()=>{G.step=Math.max(0,G.step-1);drawGasto()},
  gGo:el=>{G.step=+el.dataset.s;drawGasto()},
  gPay:el=>{G.forma=el.dataset.f;if(el.dataset.c)G.card=el.dataset.c;if(!parcelado()){G.n=1;G.vp='';G.step=G.cat?3:2}else if(G.forma==='boleto'&&+G.n<2)G.n=2;drawGasto()},
  gN:el=>{G.n=Math.min(24,Math.max(1,+G.n+ +el.dataset.d));if(+G.n===1)G.vp='';drawGasto()},
  gCat:el=>{G.cat=el.dataset.val;G.step=3;drawGasto()},
  gSet:el=>{G[el.dataset.k]=el.dataset.val;if(el.dataset.k==='forma'&&el.dataset.val!=='credito'&&el.dataset.val!=='boleto')G.n=1;drawGasto()},
  salvarGasto:()=>salvarGasto(),
  editLanc:el=>editarLanc(el.dataset.id),
  undo:()=>{if(!UNDO)return;S=JSON.parse(UNDO);UNDO=null;recompute();render();document.querySelectorAll('.toast').forEach(t=>t.remove());toast('Desfeito.')},
  gModo:el=>{UI.modo=el.dataset.m;render()},
  gDim:el=>{UI.dim=el.dataset.d;render()},
  verGrupo:el=>sheetGrupo(el.dataset.d,el.dataset.k),
  grupoMes:el=>{UI.v=+el.dataset.v;render();sheetGrupo(LASTG.d,LASTG.k)},
  editCat:el=>sheetCat(el.dataset.id||null,el.dataset.ret==='1'),
  ctIc:el=>{CATF.ic=el.dataset.e;document.querySelectorAll('#ctIcs .emo').forEach(b=>b.classList.toggle('on',b===el))},
  ctGr:el=>{CATF.grupo=el.dataset.g;document.querySelectorAll('#ctGr button').forEach(b=>b.classList.toggle('on',b===el))},
  salvarCat:el=>{const nome=document.getElementById('ctNome').value.trim();if(!nome){toast('Dê um nome para a categoria.');return}snap();
    let c=el.dataset.id?S.cats.find(x=>x.id===el.dataset.id):null;if(!c){c={id:'c'+Date.now()};S.cats.push(c)}Object.assign(c,{nome,ic:CATF.ic,grupo:CATF.grupo});
    recompute();if(CAT_RET){G.cat=c.id;G.step=3;openSheet(`<div id="gw"></div>`);drawGasto(true)}else{closeSheet()}render();toast(`Categoria "${esc(nome)}" salva.`,[{t:'Desfazer',a:'undo'}])},
  catVoltar:()=>{openSheet(`<div id="gw"></div>`);drawGasto(true)},
  editMeta:el=>sheetMeta(el.dataset.id||null),
  salvarMeta:el=>{const nome=document.getElementById('mtNome').value.trim()||'Reserva';snap();let m=el.dataset.id?S.metas.find(x=>x.id===el.dataset.id):null;
    if(!m){m={id:'p'+Date.now(),ic:'🐷',inicial:0};S.metas.push(m)}const novo=parseBRL(document.getElementById('mtSaldo').value);const atual=saldoMeta(m);
    Object.assign(m,{nome,plano:parseBRL(document.getElementById('mtAp').value),meta:parseBRL(document.getElementById('mtMeta').value),dia:Math.min(28,Math.max(1,+document.getElementById('mtDia').value||5))});
    recompute();m.inicial+=novo-saldoMeta(m);recompute();closeSheet();render();toast('Reserva salva.',[{t:'Desfazer',a:'undo'}])},
  editLivre:el=>sheetLivre(el.dataset.id||null),
  salvarLivre:el=>{snap();S.livres=S.livres||[];let x=el.dataset.id?S.livres.find(z=>z.id===el.dataset.id):null;if(!x){x={id:'l'+Date.now()};S.livres.push(x)}
    Object.assign(x,{nome:document.getElementById('lvNome').value.trim()||'Dívida',saldo:parseBRL(document.getElementById('lvSaldo').value),obs:document.getElementById('lvObs').value.trim()});closeSheet();render();toast('Dívida salva.',[{t:'Desfazer',a:'undo'}])},
  salMes:el=>sheetSalMes(+el.dataset.v),
  salvarSalMes:el=>{const v=+el.dataset.v,val=parseBRL(document.getElementById('smValor').value);snap();S.salHist=S.salHist||{};S.salHist[ymKey(v)]=val;recompute();closeSheet();render();toast(`Salário de ${mesNome(v)} salvo.`,[{t:'Desfazer',a:'undo'}])},
  novaReceitaMes:el=>sheetReceita(null,+el.dataset.v),
  editReceita:el=>sheetReceita(el.dataset.id),
  pedirDel:el=>{const t=el.dataset.tipo,id=el.dataset.id;document.getElementById(DEL_BOX[t]).innerHTML=`<div class="note warn small">${DEL_TXT[t]}</div><div class="grid2" style="margin-top:8px"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn danger" data-act="confirmaDel" data-tipo="${t}" data-id="${id}">Excluir</button></div>`},
  confirmaDel:el=>{const t=el.dataset.tipo,id=el.dataset.id;snap();
    if(t==='conta')S.recs=S.recs.filter(x=>x.id!==id);
    if(t==='receita')S.receitas=S.receitas.filter(x=>x.id!==id);
    if(t==='cat'){S.cats=S.cats.filter(x=>x.id!==id);S.lancs.forEach(l=>{if(l.cat===id)l.cat='outros'});S.recs.forEach(r=>{if(r.cat===id)r.cat='outros'})}
    if(t==='meta'){S.metas=S.metas.filter(x=>x.id!==id);S.movs=S.movs.filter(x=>x.meta!==id)}
    if(t==='livre')S.livres=S.livres.filter(x=>x.id!==id);
    recompute();closeSheet();render();toast('Excluído.',[{t:'Desfazer',a:'undo'}])},
  pedirCancel:el=>{document.getElementById('lancAcoes').innerHTML=`<div class="note warn small">As parcelas de faturas que ainda não fecharam vão sumir. As já cobradas continuam no histórico.</div><div class="grid2"><button class="btn ghost" data-act="verLanc" data-id="${el.dataset.id}">Voltar</button><button class="btn danger" data-act="cancelar" data-id="${el.dataset.id}">Confirmar</button></div>`},
  cancelar:el=>{snap();const l=S.lancs.find(x=>x.id===el.dataset.id);l.cancelado=TODAY;recompute();closeSheet();toast('Compra cancelada. As parcelas futuras saíram dos próximos meses.');render()},
  pedirExcluir:el=>{document.getElementById('lancAcoes').innerHTML=`<div class="note warn small">O lançamento some de todos os meses, como se nunca tivesse existido.</div><div class="grid2"><button class="btn ghost" data-act="verLanc" data-id="${el.dataset.id}">Voltar</button><button class="btn danger" data-act="excluir" data-id="${el.dataset.id}">Excluir</button></div>`},
  excluir:el=>{snap();S.lancs=S.lancs.filter(x=>x.id!==el.dataset.id);recompute();closeSheet();render();toast('Lançamento excluído.',[{t:'Desfazer',a:'undo'}])},
  salvarConta:el=>{const v=parseBRL(document.getElementById('cValor').value);if(!v){toast('Digite o valor.');return}snap();
    const fm=document.getElementById('cForma').value;let r=el.dataset.id?S.recs.find(x=>x.id===el.dataset.id):null;
    if(r&&v!==r.valor){r.valores=r.valores||{};for(let m=ym(r.inicio);m<TODAY_YM;m++){const k=ymKey(m);if(!(k in r.valores))r.valores[k]=r.valor}}
    if(!r){r={id:'r'+Date.now(),inicio:ymKey(TODAY_YM)};S.recs.push(r)}
    Object.assign(r,{desc:document.getElementById('cDesc').value.trim()||'Conta',cat:document.getElementById('cCat').value,valor:v,dia:Math.min(28,Math.max(1,+document.getElementById('cDia').value||10)),variavel:document.getElementById('cVarChk').checked});
    delete r.card;if(fm.startsWith('c:')){r.forma='credito';r.card=fm.slice(2)}else r.forma=fm;
    recompute();closeSheet();render();toast(`${esc(r.desc)} salva.`,[{t:'Desfazer',a:'undo'}])},
  salvarVar:el=>{const r=S.recs.find(x=>x.id===el.dataset.id),v=parseBRL(document.getElementById('cVar').value);if(!v)return;r.valores=r.valores||{};r.valores[ymKey(TODAY_YM+1)]=v;r.valor=v;recompute();closeSheet();toast(`Valor de ${mesNome(TODAY_YM+1)} atualizado.`);render()},
  encerrarConta:el=>{const r=S.recs.find(x=>x.id===el.dataset.id);r.fim=ymKey(TODAY_YM);recompute();closeSheet();toast(`${esc(r.desc)} encerrada. Some a partir de ${mesNome(TODAY_YM+1)}.`);render()},
  salvarReceita:el=>{const v=parseBRL(document.getElementById('rValor').value);if(!v){toast('Digite o valor.');return}snap();
    const t=document.getElementById('rTipo').value,d=document.getElementById('rData').value||TODAY;let e=el.dataset.id?S.receitas.find(x=>x.id===el.dataset.id):null;
    if(!e){e={id:'e'+Date.now()};S.receitas.push(e)}Object.assign(e,{desc:document.getElementById('rDesc').value.trim()||TIPOS_REC[t],tipo:t,valor:v,data:d});
    recompute();closeSheet();render();toast(`Receita salva em ${mesNome(ym(d))}.`,[{t:'Desfazer',a:'undo'}])},
  salvarMov:el=>{const v=parseBRL(document.getElementById('mValor').value);if(!v)return;S.movs.push({id:'v'+Date.now(),meta:el.dataset.id,valor:v*(+el.dataset.s),data:TODAY,desc:+el.dataset.s>0?'Aporte extra':'Resgate'});recompute();closeSheet();toast(+el.dataset.s>0?'Guardado.':'Resgatado.');render()},
  simForma:el=>{SIM.forma=el.dataset.f;if(el.dataset.c)SIM.card=el.dataset.c;render()},
  simConfirmar:()=>{const l={id:'u'+Date.now(),desc:SIM.desc||'Compra',cat:'compras',valor:SIM.valor,data:TODAY,forma:SIM.forma==='credito'?'credito':'pix'};
    if(SIM.forma==='credito'){l.card=SIM.card;if(SIM.n>1)l.parcelas=SIM.n;if(SIM.vp&&SIM.n>1)l.valorParcela=SIM.vp}
    S.lancs.push(l);recompute();const f=ITEMS.find(x=>x.lanc===l.id);UI.tab='inicio';render();scrollTo(0,0);toast(`Compra lançada. A 1ª parcela pesa em <b>${mesNome(f.ym)}</b>.`)},
  novoCartao:()=>{const id='c'+Date.now();S.cards.push({id,nome:'Novo cartão',tom:S.cards.length%2?'mint':'lilac',limite:200000,fecha:15,vence:22,fechaNaAtual:false});recompute();render();toast('Cartão criado. Ajuste fechamento e vencimento abaixo.')},
  exportar:()=>{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`meudinheiro-${TODAY}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Backup baixado.')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=ACT[el.dataset.act];if(a){a(el,e);talvezSalvar()}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.g){G[t.dataset.g]=t.value;drawPrev();return}
  if(t.dataset.sim){const k=t.dataset.sim;SIM[k]=k==='desc'?t.value:k==='n'?+t.value:parseBRL(t.value);clearTimeout(window._st);window._st=setTimeout(()=>{const id=t.id,pos=t.selectionStart;render();const n=document.getElementById(id);if(n&&n.tagName==='INPUT'){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}},450)}
});
document.addEventListener('change',e=>{
  if(e.target.id==='impFile'){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const v=JSON.parse(rd.result);if(!v||!v.lancs)throw 0;snap();S=normaliza(v);recompute();render();salvar();toast('Backup restaurado.',[{t:'Desfazer',a:'undo'}])}catch(_){toast('Esse arquivo não é um backup do MeuDinheiro.')}};rd.readAsText(f);return}
  const t=e.target,k=t.dataset.cfg;if(!k)return;
  if(k==='card'){const c=cardOf(t.dataset.id);if(t.type==='checkbox')c[t.dataset.k]=t.checked;else if(t.dataset.k==='nome')c.nome=t.value.trim()||c.nome;else if(t.dataset.k==='limite')c.limite=parseBRL(t.value)||c.limite;else c[t.dataset.k]=Math.min(28,Math.max(1,+t.value||1));toast(`${esc(c.nome)} atualizado. Faturas e meses foram recalculados.`)}
  if(k==='sal'){const v=parseBRL(t.value);if(v){S.salarios.push({de:ymKey(TODAY_YM+1),valor:v});toast(`Novo salário vale a partir de ${mesNome(TODAY_YM+1)}.`)}}
  if(k==='teto'){S.config.teto=parseBRL(t.value);toast('Teto atualizado.')}
  if(k==='dia'){S.config.salarioDia=Math.min(28,Math.max(1,+t.value||5))}
  if(k==='si'){S.config.saldoInicial=parseBRL(t.value)}
  if(k==='sobra'){S.config.levarSobra=t.checked}
  if(k==='cat'){catOf(t.dataset.id).grupo=t.value}
  recompute();render();talvezSalvar();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Enter'&&document.getElementById('gw')&&e.target.matches('#gValor,#gDesc')){e.preventDefault();ACT.gNext()}});
/* tooltip */
const tip=document.createElement('div');tip.className='tip';tip.hidden=true;document.body.appendChild(tip);
document.addEventListener('pointermove',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(!el){tip.hidden=true;return}tip.textContent=el.dataset.tip;tip.hidden=false;const x=Math.min(innerWidth-tip.offsetWidth-8,e.clientX+12);tip.style.left=Math.max(8,x)+'px';tip.style.top=(e.clientY-tip.offsetHeight-12)+'px'});
document.addEventListener('pointerleave',()=>tip.hidden=true);

function render(){
  main.innerHTML=VIEWS[UI.tab]();
  const navTab=TABS.some(t=>t.id===UI.tab)?UI.tab:'mais';
  document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${t.id===navTab?'on':''}" data-act="tab" data-t="${t.id}" aria-label="${t.nome}"><svg viewBox="0 0 24 24">${t.svg}</svg>${t.nome}</button>`).join('');
  document.querySelector('.fab').hidden=!['inicio','gastos','cartoes'].includes(UI.tab);
}
recompute();render();marcar('local');
carregarFirebase();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}

document.documentElement.dataset.model='lilas';
</script>
